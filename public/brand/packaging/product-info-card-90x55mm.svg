<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 55" role="img"><title>LSW product info card, 90 x 55 mm. PIECE and FABRIC filled per garment from confirmed specs</title><rect width="90" height="55" fill="#ece9e2"/><path fill="#0a0a0b" d="M6 4 L46 4 L46 68 L92 68 L106 96 L6 96 L22 80 L22 20 Z M138 4 L198 4 L198 24 L146 24 L146 38 L184 38 L198 52 L198 82 L184 96 L126 96 L114 84 L114 76 L178 76 L178 62 L140 62 L126 48 L126 16 Z M206 4 L234 4 L244 62 L258 14 L274 14 L288 62 L298 4 L326 4 L306 96 L282 96 L266 48 L250 96 L226 96 Z" transform="translate(6 6) scale(0.04242424242424243)"/><text x="84" y="9.5" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace" font-size="1.7" letter-spacing="0.6" fill="#0a0a0b">PRODUCT CARE</text><line x1="6" x2="84" y1="14" y2="14" stroke="#0a0a0b" stroke-width=".2"/><text x="6" y="19" text-anchor="start" font-family="'Geist Mono', ui-monospace, monospace" font-size="1.7" letter-spacing="0.4" fill="#0a0a0b">PIECE</text><line x1="20" x2="84" y1="19.4" y2="19.4" stroke="#0a0a0b" stroke-width=".15"/><text x="6" y="24" text-anchor="start" font-family="'Geist Mono', ui-monospace, monospace" font-size="1.7" letter-spacing="0.4" fill="#0a0a0b">FABRIC</text><line x1="20" x2="84" y1="24.4" y2="24.4" stroke="#0a0a0b" stroke-width=".15"/><text x="6" y="30.5" text-anchor="start" font-family="'Geist Mono', ui-monospace, monospace" font-size="1.7" letter-spacing="0.4" fill="#0a0a0b">CRYSTAL CARE</text><text x="6" y="35" text-anchor="start" font-family="Geist, Arial, sans-serif" font-size="2" fill="#3a3c41">Turn inside out. Wash cold on a gentle cycle.</text><text x="6" y="38.6" text-anchor="start" font-family="Geist, Arial, sans-serif" font-size="2" fill="#3a3c41">Hang dry. No tumble dryer, no bleach.</text><text x="6" y="42.2" text-anchor="start" font-family="Geist, Arial, sans-serif" font-size="2" fill="#3a3c41">Never iron over stones or prints.</text><text x="6" y="45.8" text-anchor="start" font-family="Geist, Arial, sans-serif" font-size="2" fill="#3a3c41">A loose stone? Contact us — we'd rather fix it.</text><text x="84" y="51" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace" font-size="1.4" letter-spacing="0.2" fill="#7a7d83">CONFIRM WASH STEPS AGAINST THE CARE LABEL</text></svg>
