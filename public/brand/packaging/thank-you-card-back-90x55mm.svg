<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 55" role="img"><title>LSW thank-you card back, 90 x 55 mm. QR slot: add only once the URL is live and test-scanned</title><rect width="90" height="55" fill="#0a0a0b"/><rect x="3" y="3" width="84" height="49" fill="none" stroke="#2a2b2f" stroke-width=".25"/><path fill="#c9ccd1" d="M6 4 L46 4 L46 68 L92 68 L106 96 L6 96 L22 80 L22 20 Z M138 4 L198 4 L198 24 L146 24 L146 38 L184 38 L198 52 L198 82 L184 96 L126 96 L114 84 L114 76 L178 76 L178 62 L140 62 L126 48 L126 16 Z M206 4 L234 4 L244 62 L258 14 L274 14 L288 62 L298 4 L326 4 L306 96 L282 96 L266 48 L250 96 L226 96 Z" transform="translate(8 9) scale(0.05454545454545454)"/><text x="8" y="22" text-anchor="start" font-family="Geist, Arial, sans-serif" font-size="2.6" fill="#ece9e2">Thank you for wearing LSW.</text><text x="8" y="27" text-anchor="start" font-family="Geist, Arial, sans-serif" font-size="2.1" fill="#92959b">This piece was made in a limited run, on purpose.</text><text x="8" y="31" text-anchor="start" font-family="Geist, Arial, sans-serif" font-size="2.1" fill="#92959b">Same mission. Different day.</text><text x="8" y="45" text-anchor="start" font-family="'Geist Mono', ui-monospace, monospace" font-size="1.8" letter-spacing="0.5" fill="#c9ccd1">FAITH / DISCIPLINE / PURPOSE</text><rect x="68" y="22" width="14" height="14" fill="none" stroke="#2a2b2f" stroke-dasharray="1 1" stroke-width=".3"/><text x="75" y="29.6" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="1.6" letter-spacing="0.6" fill="#92959b">QR</text><text x="75" y="39" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="1.5" letter-spacing="0.2" fill="#92959b">next drop list</text></svg>
